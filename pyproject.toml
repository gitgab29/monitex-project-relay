[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay"
version = "0.1.0"
description = "Project Relay - camera feed to structured security events to routed actions"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "gitgab29" }]

dependencies = [
    "ultralytics>=8.4,<9",
    "opencv-python>=4.10,<5",
    "pydantic>=2.12,<3",
    "google-genai>=2.24,<3",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
relay = "relay.cli:main"

[project.urls]
Repository = "https://github.com/gitgab29/monitex-project-relay"

[tool.setuptools.packages.find]
include = ["relay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
